version: "3.8"

services:
  backend:
    build:
      context: ./AgriShift-AI
      dockerfile: Dockerfile
    container_name: agrishift-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AgriShift AI
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DEBUG=True
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - DEFAULT_LATITUDE=22.90
      - DEFAULT_LONGITUDE=88.40
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrishift-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_USE_MOCKS=false
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: agrishift-network
